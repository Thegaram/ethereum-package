# EIP-8142 "Block-in-Blobs" (Bib) devnet — native flow.
# 2 ethrex (EL) + lighthouse (CL + VC).
# Genesis is Fulu; Bib activates at epoch 1.
# Everything else falls back to ethereum-package defaults.
participants:
  - el_type: ethrex
    el_image: ethrex:bib # locally built: docker build -t ethrex:bib .
    cl_type: lighthouse
    cl_image: lighthouse:bib # locally built: docker build -t lighthouse:bib .
    vc_type: lighthouse
    vc_image: lighthouse:bib
    count: 2
    cl_log_level: debug # lighthouse --debug-level=debug (da_checker / fork-choice observability)
    el_min_cpu: 4000 # CPU headroom for parallel payload blob cell proof computation.
    el_min_mem: 4096

network_params:
  fulu_fork_epoch: 0
  bib_fork_epoch: 1
  # ethrex couples Amsterdam to the BPO2 blob params: get_fork_blob_schedule() returns the
  # bpo2 schedule (max 21) as soon as Amsterdam (== eip8142Time == the Bib epoch) is active,
  # regardless of the BPO schedule. The CL only bumps blob capacity at bpo_2_epoch, which
  # defaults to u64::MAX (disabled) -> the CL stays at bpo1's max 15 while the EL builds up
  # to 21-blob payloads -> ExecutionInvalidBlobsLen { max: 15, actual: 21 } and the chain
  # stalls at activation. Align the CL's 21-blob bump with the EL by activating bpo2 at the
  # Bib epoch.
  bpo_2_epoch: 1 # MUST match bib_fork_epoch (EL ties max-blobs=21 to Amsterdam/Bib)
  gloas_fork_epoch: 18446744073709551615 # ePBS off

additional_services:
  - prometheus_grafana
  - spamoor

spamoor_params:
  spammers:
    # Light, cheap transfers — small BAL contribution, many distinct accounts.
    - name: "EOA (light transfers, variable accounts)"
      scenario: eoatx
      config:
        throughput: 500
        max_pending: 4000
        max_wallets: 6000
        base_fee: 20
    # Heavier ERC-20 txs — more gas + contract-storage writes => bigger, more variable
    # BAL, and (different gas/tx vs eoatx) a swinging tx-count-per-block.
    - name: "ERC-20 (heavy, storage-touching)"
      scenario: erctx
      config:
        throughput: 300
        max_pending: 2000
        max_wallets: 3000
        base_fee: 20
    - name: "Blobs (moderate, variable sidecars)"
      scenario: blob-combined
      config:
        throughput: 3           # ~3 type-3 blob txs/slot
        sidecars: 2             # 2 blobs/tx -> ~6 user blobs/slot peak, well under 21
        max_pending: 12
        max_wallets: 40
        base_fee: 20
        blob_fee: 20
    # ----------------------------------------------------------------------------
    # BIG BLOCK SPAMMER (PAYLOAD-BLOB FILLER) — DISABLED BY DEFAULT.
    # Purpose: drive blocks past >4 EIP-8142 *payload* blobs by packing large
    # calldata (payload blobs encode RLP(BAL)+RLP(txs), so they scale with bytes,
    # not gas).
    #
    # - name: "Big block (payload-blob filler)"
    #   scenario: eoatx
    #   config:
    #     throughput: 30
    #     max_pending: 200
    #     max_wallets: 500
    #     base_fee: 20
    #     tip_fee: 2
    #     gas_limit: 2000000      # covers random:25000 (~1.62M) floor gas
    #     amount: 20
    #     data: "random:25000"    # 25k random bytes/tx; alternatively use "repeat:0x00:25000" with lower gas_limit
